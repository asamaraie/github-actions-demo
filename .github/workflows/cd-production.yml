name: Deploy to Production

# Triggered manually, or by pushing a version tag (e.g. v1.2.0).
# Manual trigger lets a human decide *when* staging gets promoted to production,
# which is the safest default while you're learning the pipeline.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production # configure this Environment in GitHub with "required reviewers"
    # so it pauses and waits for someone to click "approve" before running.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to production
        run: |
          echo "Trigger Production site deploy via Render deploy hook"
          curl -fsS -X POST "${{ secrets.RENDER_SITE_DEPLOY_HOOK }}"
          echo "Trigger Production API deploy via Render deploy hook"
          curl -fsS -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"
