name: Deploy to Production

# Triggered manually, or by pushing a version tag (e.g. v1.2.0).
# Manual trigger lets a human decide *when* staging gets promoted to production,
# which is the safest default while you're learning the pipeline.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production # configure this Environment in GitHub with "required reviewers"
    # so it pauses and waits for someone to click "approve" before running.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          APP_ENV: production
          API_BASE_URL: ${{ vars.API_URL }}
        run: npm run build

      - name: Deploy to production
        env:
          RENDER_SITE_DEPLOY_HOOK: ${{ secrets.RENDER_SITE_DEPLOY_HOOK }}
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_SITE_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_SITE_DEPLOY_HOOK secret is not set. Configure it in the production environment."
            exit 1
          fi
          if [ -z "$RENDER_API_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_API_DEPLOY_HOOK secret is not set. Configure it in the production environment."
            exit 1
          fi
          echo "Trigger Production site deploy via Render deploy hook"
          curl -fsS -X POST "$RENDER_SITE_DEPLOY_HOOK"
          echo "Trigger Production API deploy via Render deploy hook"
          curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK"
