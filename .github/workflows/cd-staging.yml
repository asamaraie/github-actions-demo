name: Deploy to Staging

# Runs automatically every time a merge lands on main.
# By the time this runs, CI has already passed (that's a prerequisite for the merge itself),
# so this workflow focuses purely on build + deploy, not re-testing everything from scratch.
on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging # maps to a GitHub "Environment" you configure in repo settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to staging
        run: |
          echo "Trigger Staging site deploy via Render deploy hook"
          curl -fsS -X POST "${{ secrets.RENDER_SITE_DEPLOY_HOOK }}"
          echo "Trigger Staging API deploy via Render deploy hook"
          curl -fsS -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"

  smoke-test-staging:
    needs: deploy-staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Render deploys asynchronously and free-tier services can take a
      # while to build/boot, so give it a head start before checking.
      - name: Wait for Render deploys to finish
        run: sleep 60

      - name: Smoke test staging site
        run: curl -sSL "${{ vars.SITE_URL }}" | grep "Hello, World!"

      - name: Smoke test staging API
        run: curl -sSL "${{ vars.API_URL }}/api/hello" | grep "Hello, World!"