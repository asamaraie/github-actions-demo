apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello-world
  labels:
    app: hello-world
spec:
  replicas: ${REPLICAS}
  # Bounds how far `rollout undo` reaches, and therefore how many images
  # scripts/cleanup-registry.sh must keep.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: app
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # APP_ENV=local keeps serveStatic on (see src/app.js), so this
            # single container serves both the page and /api/hello.
            - name: APP_ENV
              value: local
            - name: PORT
              value: '3000'
          readinessProbe:
            httpGet:
              path: /api/hello
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hello
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
